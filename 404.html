<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <meta name="theme-color" content="#1e1e2e">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <body class="bg-bg text-fg font-sans min-h-dvh flex items-center justify-center p-4">
    <main class="w-full max-w-lg font-mono">
      <div class="bg-card border border-border rounded-xl p-6 shadow-2xl space-y-4">
        <div class="text-sm">
          <span class="text-prompt">lnminh@vn</span><span class="text-fg-muted">:~$ </span><span class="text-fg">cd </span><span id="notfound-path" class="text-fg"></span>

        <p id="notfound-error" class="text-danger text-sm">bash: cd: /: No such file or directory</p>
        <p class="text-fg-muted text-sm">Imagine typing wrong...</p>
        <div class="pt-2">
          <a href="/" class="inline-flex items-center gap-2 text-accent hover:underline text-sm font-medium">
            &larr; cd ~
          </a>
        </div>
      </div>
    </main>
    <script type="module" src="/src/notfound.ts"></script>
